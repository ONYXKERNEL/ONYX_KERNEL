
name: Build ONYX KERNEL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ONYX_KERNEL_ROHITO...Updated.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source project
        run: |
          mkdir source
          unzip -q ONYX_KERNEL_ROHITO...Updated.zip -d source

      - name: Build APK
        working-directory: source/ONYX_KERNEL
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ONYX-KERNEL-APK
          path: source/ONYX_KERNEL/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
